<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PopStar Simulator</title>
    <link rel="stylesheet" href="style.css">
    <!-- This tag makes it behave like a native app on iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div id="game-container">
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1>PopStar Sim</h1>
            <p>Your rise to the top of the charts begins here.</p>
            <button onclick="showScreen('creation-screen')">New Game</button>
        </div>

        <!-- CHARACTER CREATION SCREEN -->
        <div id="creation-screen" class="screen">
            <h2>Create Your Artist</h2>
            <div class="input-group">
                <label>Artist Name:</label>
                <input type="text" id="artist-name" placeholder="e.g. Lil' Coder or The Weekday">
            </div>
            
            <div class="input-group">
                <label>Origin Story:</label>
                <div class="origin-options">
                    <button class="origin-btn" onclick="selectOrigin('childActor')">Child Actor</button>
                    <button class="origin-btn" onclick="selectOrigin('bedroomProducer')">Bedroom Producer</button>
                    <button class="origin-btn" onclick="selectOrigin('realityTV')">Reality TV Contestant</button>
                    <button class="origin-btn" onclick="selectOrigin('indieGrinder')">Indie Gig Grinder</button>
                </div>
            </div>
            <p id="origin-description" class="hint-text"></p>

            <button id="start-career-btn" onclick="startCareer()" disabled="">Start Career</button>
        </div>

        <!-- MAIN GAME SCREEN -->
        <div id="main-screen" class="screen">
            <header>
                <h2 id="ui-name">Name</h2>
                <div class="bank">Bank: $<span id="ui-money">0</span></div>
            </header>
            
            <div class="stats-container">
                <h3>Artist Stats</h3>
                <div id="stats-grid" class="grid">
                    <!-- Stats will be injected here by Javascript -->
                </div>
            </div>

            <div class="actions">
                <button class="action-btn disabled">Release Music (Locked)</button>
                <button class="action-btn disabled">View Discography (Locked)</button>
                <button class="action-btn next-turn-btn">Next Month</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body></html>
